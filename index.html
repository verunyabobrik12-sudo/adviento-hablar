<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¡A hablar! Calendario de Adviento</title>
<meta name="description" content="Calendario de Adviento para practicar español hablando: una ventanita con una tarea oral cada día.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🎁%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#0e3b43; --bg2:#0a2a3a; --ink:#16323a; --paper:#fffaf0;
  --gold:#ffcf4a; --gold-d:#e9a800; --teal:#12b5b0; --coral:#ff6f61; --plum:#7a4fd6; --leaf:#3fb37f;
  --radius:18px;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Nunito',system-ui,sans-serif; color:#fff; min-height:100vh;
  background:
    radial-gradient(circle at 15% 10%, #1b6a72 0, transparent 40%),
    radial-gradient(circle at 85% 90%, #2a4b8f 0, transparent 45%),
    linear-gradient(160deg,var(--bg1),var(--bg2));
  background-attachment:fixed; overflow-x:hidden;
}
#snow{position:fixed;inset:0;pointer-events:none;z-index:0}
main{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:28px 16px 60px}
header{text-align:center;margin-bottom:22px}
.kicker{font-weight:800;letter-spacing:.18em;text-transform:uppercase;font-size:.8rem;color:var(--gold)}
h1{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(2.4rem,9vw,4.6rem);line-height:1.02;margin:6px 0 10px;
  color:#fff;-webkit-text-stroke:0;text-shadow:0 4px 0 #0a2a3a,0 0 30px rgba(255,207,74,.35)}
h1 span{color:var(--gold)}
.lead{max-width:560px;margin:0 auto;color:#d6eef0;font-size:1.05rem;line-height:1.5}
.bar{max-width:420px;margin:18px auto 0}
.bar-top{display:flex;justify-content:space-between;font-weight:800;font-size:.9rem;color:#d6eef0;margin-bottom:6px}
.track{height:12px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
.fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--coral));transition:width .6s}

.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-top:26px}
@media(max-width:820px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:520px){.grid{grid-template-columns:repeat(3,1fr);gap:10px}}

.door{position:relative;aspect-ratio:1/1.08;perspective:700px;border:0;background:none;padding:0;cursor:pointer;font:inherit;color:inherit}
.door .inside{position:absolute;inset:0;border-radius:var(--radius);display:grid;place-items:center;
  background:var(--paper);color:var(--ink);box-shadow:inset 0 3px 10px rgba(0,0,0,.25);font-size:2.2rem}
.door .leaf{position:absolute;inset:0;border-radius:var(--radius);transform-origin:left center;transition:transform .7s cubic-bezier(.5,.1,.2,1);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:var(--c);box-shadow:0 6px 0 rgba(0,0,0,.22),0 10px 18px rgba(0,0,0,.25);overflow:hidden}
.door .leaf::before{content:"";position:absolute;inset:7px;border:2px dashed rgba(255,255,255,.55);border-radius:calc(var(--radius) - 6px)}
.door .leaf::after{content:"";position:absolute;right:11px;top:50%;width:11px;height:11px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px rgba(0,0,0,.18)}
.door .n{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(1.8rem,5.5vw,2.8rem);line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.2);position:relative}
.door .tag{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;opacity:.95;position:relative}
.door:hover:not(.locked) .leaf{transform:rotateY(-24deg)}
.door.done .leaf{transform:rotateY(-110deg)}
.door.done .inside::after{content:"✓";position:absolute;top:6px;right:9px;font-size:1rem;font-weight:800;color:#fff;background:var(--leaf);width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
.door.today .leaf{animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{box-shadow:0 6px 0 rgba(0,0,0,.22),0 0 0 0 rgba(255,207,74,.8)}50%{box-shadow:0 6px 0 rgba(0,0,0,.22),0 0 0 10px rgba(255,207,74,0)}}
.door.locked{cursor:not-allowed}
.door.locked .leaf{filter:saturate(.35) brightness(.7)}
.door.locked .tag::before{content:"🔒 "}
.door.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.c0{--c:var(--coral)}.c1{--c:var(--teal)}.c2{--c:var(--plum)}.c3{--c:#f08a1c}.c4{--c:var(--leaf)}.c5{--c:#3b7bd8}

.note{text-align:center;margin-top:28px;color:#b7dadd;font-size:.92rem;line-height:1.5}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);opacity:0;background:var(--paper);color:var(--ink);
  padding:12px 18px;border-radius:14px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.35);transition:.3s;z-index:30;max-width:90vw;text-align:center}
.toast.show{transform:translate(-50%,0);opacity:1}

/* tarjeta */
.overlay{position:fixed;inset:0;background:rgba(5,20,28,.78);backdrop-filter:blur(4px);z-index:20;display:none;
  align-items:flex-start;justify-content:center;overflow-y:auto;padding:20px 12px}
.overlay.open{display:flex}
.card{width:100%;max-width:560px;border-radius:26px;overflow:hidden;background:var(--teal);color:var(--ink);
  box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .45s cubic-bezier(.3,1.4,.5,1);margin:auto}
@keyframes pop{from{transform:scale(.7) rotate(-3deg);opacity:0}}
.card-head{background:var(--gold);text-align:center;padding:22px 18px 16px;position:relative}
.close{position:absolute;top:10px;right:12px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.12);color:var(--ink);font-size:1.3rem;cursor:pointer;font-weight:800}
.close:hover{background:rgba(0,0,0,.22)}
.day{display:inline-block;background:var(--ink);color:var(--gold);font-weight:800;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;padding:4px 12px;border-radius:99px}
.card h2{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(2rem,9vw,3.1rem);line-height:1.05;margin:8px 0 6px;color:#fff;
  -webkit-text-stroke:7px var(--ink);paint-order:stroke fill;text-transform:uppercase;letter-spacing:.01em;word-break:break-word}
.instr{font-weight:800;font-style:italic;font-size:1.02rem}
.chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.chip{background:rgba(22,50,58,.12);border-radius:99px;padding:3px 11px;font-size:.78rem;font-weight:800}
.card-body{padding:16px 14px 18px}
.scene{border:4px solid #fff;border-radius:14px;padding:18px 10px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:center;align-items:center;
  font-size:clamp(2.2rem,11vw,3.4rem);line-height:1.15;min-height:170px;text-align:center}
.qbox{background:#f6f7ff;border-radius:22px;padding:16px 18px 16px 14px}
.qbox ol,.qbox ul{padding-left:24px;display:grid;gap:8px;font-size:1.05rem;line-height:1.38;font-weight:600}
.qbox li::marker{color:var(--coral);font-weight:800}
.help{margin-top:12px;background:rgba(255,255,255,.22);border-radius:16px;color:#06303a}
.help summary{cursor:pointer;font-weight:800;padding:11px 16px;list-style:none}
.help summary::-webkit-details-marker{display:none}
.help summary::before{content:"💡 "}
.help div{padding:0 16px 14px;font-weight:600;line-height:1.5;color:#06303a}
.help b{background:#fff;border-radius:6px;padding:0 6px;margin-right:2px;display:inline-block;margin-bottom:3px}
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{flex:1;min-width:140px;border:0;border-radius:14px;padding:13px 16px;font:inherit;font-weight:800;font-size:1rem;cursor:pointer;
  box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.main{background:var(--gold);color:var(--ink)}
.btn.sec{background:#fff;color:var(--ink)}
.btn.main.is-done{background:var(--leaf);color:#fff}
footer.card-foot{text-align:center;padding:0 0 14px;font-size:.78rem;font-weight:800;letter-spacing:.14em;color:#06303a;opacity:.7}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<main>
  <header>
    <div class="kicker">Calendario de Adviento · Español</div>
    <h1>¡A <span>hablar!</span></h1>
    <p class="lead">Cada día se abre una ventanita nueva con una tarea para hablar. Lee las preguntas y responde en voz alta. ¡Sin miedo a equivocarte!</p>
    <div class="bar">
      <div class="bar-top"><span>Tu progreso</span><span id="count">0 / 30</span></div>
      <div class="track"><div class="fill" id="fill"></div></div>
    </div>
  </header>

  <section class="grid" id="grid" aria-label="Ventanas del calendario"></section>

  <p class="note" id="note"></p>
</main>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="ctitle">
  <article class="card" id="card"></article>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ============ AJUSTES (para la profesora) ============
   START — fecha de la ventana nº 1 (año, mes 1-12, día).
   Para ver todas las ventanas abiertas: añade ?profe a la dirección de la página. */
const START = { y: 2026, m: 11, d: 1 };

/* ============ TAREAS ============
   t: título · ti: instrucción · g: gramática · k: "tema" | "imagen"
   q: preguntas · h: ayuda (palabras y estructuras) · s: escena (solo para imágenes) */
const TASKS = [
 /* --- Gerundio y futuro perfecto --- */
 {t:"Chocolate",k:"tema",g:["Presente","Estar + gerundio"],ti:"Lee las preguntas y responde.",
  q:["¿Eres más de chocolate negro, con leche o blanco? ¿Por qué?","¿Estás comiendo algo dulce ahora? ¿Qué estás tomando?","¿Cómo prefieres el chocolate: en bombones, en tabletas, en postres o en bebidas calientes?","Si tuvieras que regalar chocolate a alguien, ¿a quién y por qué?"],
  h:"Me gusta más… · Prefiero… · Se lo regalaría a… porque…"},
 {t:"En el café",k:"imagen",g:["Estar + gerundio"],ti:"Mira la imagen y describe qué está pasando.",
  s:{bg:"linear-gradient(135deg,#ffe3b3,#ffb88c)",e:["☕","🧔","📖","💻","🥐","👵","🐕","🌧️"]},
  q:["¿Dónde están las personas?","¿Qué están haciendo? Inventa una frase para cada persona.","¿Qué está pasando fuera del café?","¿Qué está tomando cada persona? ¿Qué están comiendo?","¿Quién crees que está más contento? ¿Por qué?"],
  h:"está leyendo · está trabajando · están hablando · está bebiendo · está lloviendo"},
 {t:"Mañana a esta hora",k:"tema",g:["Futuro perfecto"],ti:"Habla de lo que habrás hecho.",
  q:["¿Qué habrás hecho para el viernes que viene?","¿Qué cosa habrás terminado antes de las seis de la tarde de mañana?","Para el domingo, ¿a quién habrás llamado o visto?","¿Qué cosa te gustaría haber hecho antes de que acabe este mes?"],
  h:"Para el… ya habré + participio (terminado, hecho, visto, comprado) · Antes de… habré…"},
 {t:"Mi ciudad ahora",k:"tema",g:["Estar + gerundio","Presente"],ti:"Imagina tu ciudad en este momento.",
  q:["¿Qué está pasando ahora mismo en tu ciudad?","¿Qué están haciendo tus vecinos o tu familia en este momento?","¿Hace sol, llueve o nieva? ¿Qué está haciendo la gente en la calle?","¿Qué lugar de tu ciudad está lleno de gente ahora?"],
  h:"ahora mismo · en este momento · la gente está + gerundio (caminando, esperando, comprando…)"},
 {t:"Plan de fin de semana",k:"tema",g:["Futuro perfecto","Futuro"],ti:"Cuenta tus planes y lo que ya habrás hecho.",
  q:["¿Qué vas a hacer este fin de semana?","¿Qué habrás hecho antes del domingo por la noche?","¿Qué tareas de casa habrás terminado para el sábado?","Si todo sale bien, ¿qué habrás conseguido al final del fin de semana?"],
  h:"Voy a… · El sábado haré… · Para el domingo ya habré…"},
 {t:"En el parque",k:"imagen",g:["Estar + gerundio"],ti:"Mira la imagen y describe qué están haciendo.",
  s:{bg:"linear-gradient(135deg,#c8f2c0,#8fd9b6)",e:["🌳","🧒","🪁","🐕","🚴","⚽","🧺","🦆"]},
  q:["¿Cuántas personas y animales hay en el parque?","¿Qué está haciendo cada uno?","¿Qué tiempo hace? ¿Es de día o de noche?","¿Qué objetos puedes ver?","¿Te gustaría estar en este parque? ¿Qué estarías haciendo?"],
  h:"está jugando · está corriendo · están paseando · está volando · está comiendo"},
 {t:"Dentro de cinco años",k:"tema",g:["Futuro perfecto"],ti:"Mira hacia el futuro y responde.",
  q:["Dentro de cinco años, ¿qué habrás aprendido?","¿Qué países habrás visitado?","¿Cuántos libros o películas en español habrás leído o visto?","¿Qué cosa importante habrá cambiado en tu vida?"],
  h:"Dentro de cinco años habré… · Para entonces ya habré… · habrá cambiado"},
 {t:"Mi familia ahora",k:"tema",g:["Estar + gerundio"],ti:"Habla de tu gente en este momento.",
  q:["¿Dónde está tu familia ahora y qué está haciendo cada persona?","¿Quién está trabajando y quién está descansando?","¿Qué están preparando para la cena?","¿Con quién estás hablando por teléfono estos días?"],
  h:"mi madre está cocinando · mis amigos están viajando · están esperando"},
 {t:"La fiesta",k:"imagen",g:["Estar + gerundio","Futuro perfecto"],ti:"Describe la fiesta y haz predicciones.",
  s:{bg:"linear-gradient(135deg,#ffd1f0,#c9b6ff)",e:["🎂","🎈","🕺","💃","🎁","🎶","🥂","📸"]},
  q:["¿Qué celebran las personas? ¿Cómo lo sabes?","¿Qué están haciendo? ¿Quién está bailando, quién está sacando fotos?","¿Qué están comiendo y bebiendo?","¿Qué habrá pasado antes de la fiesta? Inventa dos cosas con «habrá»."],
  h:"están celebrando · está bailando · Habrán comprado… · Habrán preparado…"},
 {t:"Antes de fin de año",k:"tema",g:["Futuro perfecto"],ti:"Haz tu lista de metas.",
  q:["¿Qué metas habrás cumplido antes del 31 de diciembre?","¿Qué regalo habrás comprado para tu familia?","¿Qué cosa nueva habrás probado?","¿Cómo te sentirás cuando hayas terminado todo?"],
  h:"Antes del 31 de diciembre habré… · Cuando haya terminado…"},

 /* --- Pretérito indefinido --- */
 {t:"Ayer",k:"tema",g:["Pretérito indefinido"],ti:"Cuenta qué hiciste ayer.",
  q:["¿A qué hora te levantaste ayer y qué desayunaste?","¿Adónde fuiste? ¿Con quién hablaste?","¿Qué comiste y qué cenaste?","¿Qué fue lo mejor de ayer?"],
  h:"me levanté · desayuné · comí · fui · hablé · vi · hice · volví · ayer · anoche · a las…"},
 {t:"El fin de semana pasado",k:"tema",g:["Pretérito indefinido"],ti:"Cuenta tu fin de semana.",
  q:["¿Qué hiciste el sábado por la mañana y por la tarde?","¿Saliste con alguien? ¿Adónde fueron?","¿Qué compraste o qué cocinaste?","¿Qué hiciste el domingo?","¿Fue un buen fin de semana? ¿Por qué?"],
  h:"el sábado · el domingo · por la mañana · después · luego · al final · fue + adjetivo"},
 {t:"En el restaurante",k:"imagen",g:["Pretérito indefinido"],ti:"Mira la imagen e imagina qué pasó antes.",
  s:{bg:"linear-gradient(135deg,#ffe0a8,#f4a261)",e:["🍝","🍷","🧔","🍰","👫","🧾","🕯️","🥖"]},
  q:["¿Qué pidieron las personas?","¿Cuánto tiempo esperaron la comida?","¿Qué pasó antes de llegar al restaurante? Inventa dos cosas.","¿Quién pagó la cuenta?","¿Qué dijo el camarero?"],
  h:"pidieron · esperaron · llegaron · pagó · dijo · comieron · bebieron · reservaron"},
 {t:"Mis vacaciones",k:"tema",g:["Pretérito indefinido"],ti:"Cuenta tus últimas vacaciones.",
  q:["¿Adónde fuiste en tus últimas vacaciones?","¿Cómo viajaste y con quién?","¿Qué lugares visitaste?","¿Qué comiste? ¿Qué compraste?","¿Qué fue lo más divertido?"],
  h:"fui · viajé · visité · vi · probé · compré · conocí · me quedé en…"},
 {t:"El mejor regalo",k:"tema",g:["Pretérito indefinido"],ti:"Habla de un regalo especial.",
  q:["¿Cuál fue el mejor regalo que recibiste?","¿Quién te lo regaló y cuándo?","¿Qué hiciste cuando lo abriste?","¿Qué regalo hiciste tú que gustó mucho?"],
  h:"me regaló · lo abrí · me encantó · me puse muy contento/a · le di…"},
 {t:"En el mercado",k:"imagen",g:["Pretérito indefinido"],ti:"Mira la imagen y cuenta qué pasó esta mañana.",
  s:{bg:"linear-gradient(135deg,#fff1a8,#a8e6a3)",e:["🍎","🥕","🧀","🐟","🧺","👩","💶","🌻"]},
  q:["¿Qué compró la persona?","¿Con quién habló? ¿Qué le preguntó?","¿Cuánto pagó?","¿Qué olvidó comprar?","¿Qué hizo después?"],
  h:"compró · preguntó · pagó · olvidó · llevó · regateó · salió"},
 {t:"Un viaje inolvidable",k:"tema",g:["Pretérito indefinido"],ti:"Cuenta un viaje que te marcó.",
  q:["¿Cuándo y adónde viajaste?","¿Qué pasó el primer día?","¿A quién conociste?","¿Hubo algún problema? ¿Cómo lo resolviste?","¿Volverías? ¿Por qué?"],
  h:"el primer día · de repente · perdí · encontré · conocí · tuve que… · pude…"},
 {t:"Una película o un libro",k:"tema",g:["Pretérito indefinido"],ti:"Resume una historia que te gustó.",
  q:["¿Qué película vista o libro leído te gustó mucho?","¿Quién fue el protagonista?","¿Qué le pasó? Cuéntalo con tres frases.","¿Cómo terminó la historia?"],
  h:"empezó · pasó · murió · se enamoró · descubrió · terminó · al final"},
 {t:"Una historia misteriosa",k:"imagen",g:["Pretérito indefinido"],ti:"Mira la imagen e inventa una historia.",
  s:{bg:"linear-gradient(135deg,#2b2d5b,#6c4a9e)",e:["🏚️","🌕","🗝️","🦉","🕯️","🚪","👻","🔦"]},
  q:["¿Quién llegó a la casa y por qué?","¿Qué encontró dentro?","¿Qué oyó? ¿Qué vio?","¿Qué hizo entonces?","¿Cómo terminó la noche?"],
  h:"llegó · abrió · encontró · oyó · vio · corrió · escondió · salió"},
 {t:"Hoy, ayer y mañana",k:"tema",g:["Mezcla de tiempos"],ti:"Usa tres tiempos distintos.",
  q:["¿Qué estás haciendo ahora mismo en tu vida (estudios, trabajo)?","¿Qué hiciste esta semana que fue importante?","¿Qué habrás hecho para finales de este mes?","Une las tres ideas en una pequeña historia."],
  h:"estoy + gerundio · ayer / la semana pasada + indefinido · para finales de… habré…"},
 {t:"Una celebración",k:"tema",g:["Pretérito indefinido"],ti:"Cuenta cómo celebraste algo.",
  q:["¿Qué celebraste la última vez? ¿Dónde?","¿Quién vino y qué hicieron?","¿Qué comisteis y qué bebisteis?","¿Cómo terminó el día?"],
  h:"celebramos · vinieron · bailamos · cantamos · brindamos · nos reímos · volvimos"},
 {t:"Mi último cumpleaños",k:"tema",g:["Pretérito indefinido"],ti:"Cuenta tu último cumpleaños.",
  q:["¿Cuándo fue tu último cumpleaños y cuántos años cumpliste?","¿Cómo lo pasaste? ¿Con quién?","¿Qué te regalaron?","¿Qué sorpresa tuviste?","¿Qué quieres hacer en el próximo?"],
  h:"cumplí… años · lo celebré · me regalaron · me sorprendió · me felicitaron"},

 /* --- Pretérito imperfecto (al final) --- */
 {t:"Cuando era niño/a",k:"tema",g:["Pretérito imperfecto"],ti:"Habla de tu infancia.",
  q:["¿Cómo eras de pequeño/a?","¿A qué jugabas con tus amigos?","¿Qué te gustaba comer? ¿Qué no soportabas?","¿Qué querías ser de mayor?"],
  h:"era · jugaba · tenía · me gustaba · quería · vivía · de pequeño/a"},
 {t:"La casa de mi infancia",k:"tema",g:["Pretérito imperfecto"],ti:"Describe un lugar del pasado.",
  q:["¿Dónde vivías cuando eras pequeño/a?","¿Cómo era tu casa? ¿Cuántas habitaciones tenía?","¿Cuál era tu lugar favorito de la casa?","¿Quién vivía contigo?"],
  h:"vivía · era grande/pequeña · tenía · había · estaba cerca de…"},
 {t:"La escuela",k:"tema",g:["Pretérito imperfecto"],ti:"Recuerda cómo eran tus días en la escuela.",
  q:["¿Cómo era un día normal en la escuela?","¿Qué asignaturas te gustaban más?","¿Cómo se llamaba tu profesor/a favorito/a? ¿Cómo era?","¿Qué hacías en el recreo?"],
  h:"todos los días · siempre · a veces · solía… · me levantaba · íbamos"},
 {t:"Una foto antigua",k:"imagen",g:["Pretérito imperfecto"],ti:"Mira la imagen y describe cómo era antes.",
  s:{bg:"linear-gradient(135deg,#e9dcc3,#bfa57a)",e:["📷","👵","👴","🏡","🐓","🚲","🌻","🧸"]},
  q:["¿Quiénes eran las personas de la foto?","¿Cómo eran? ¿Qué llevaban puesto?","¿Dónde vivían? ¿A qué se dedicaban?","¿Qué hacían todos los domingos?","¿Qué tiempo hacía ese día?"],
  h:"eran · llevaba · vivían · trabajaba · hacía sol · cada domingo"},
 {t:"Antes y ahora",k:"tema",g:["Imperfecto","Presente"],ti:"Compara el pasado con el presente.",
  q:["¿Qué cosas hacías antes que ya no haces?","¿Cómo era tu ciudad hace diez años? ¿Y cómo es ahora?","¿Qué costumbres tenías antes y cuáles tienes ahora?","¿Qué echas de menos?"],
  h:"antes · ahora · ya no · todavía · solía + infinitivo · echo de menos…"},
 {t:"Un día de lluvia",k:"imagen",g:["Imperfecto","Indefinido"],ti:"Mira la imagen y cuenta lo que pasó.",
  s:{bg:"linear-gradient(135deg,#b9cfe6,#7f9bc4)",e:["🌧️","☂️","🚌","🧍","🐈","🏃","📱","🚕"]},
  q:["¿Qué tiempo hacía? ¿Qué hacía la gente en la calle?","¿Qué llevaba cada persona?","¿Qué pasó de repente?","¿Qué hizo la persona de la imagen entonces?"],
  h:"Llovía · hacía frío · estaba esperando… cuando de repente… · decidió · tomó"},
 {t:"Estaba… cuando…",k:"tema",g:["Imperfecto","Indefinido"],ti:"Cuenta qué pasó mientras hacías otra cosa.",
  q:["¿Qué estabas haciendo cuando sonó el teléfono por última vez?","¿Qué pasó mientras dormías, cocinabas o caminabas?","Cuenta una vez que perdiste algo importante: ¿qué estabas haciendo?","¿Qué estabas pensando cuando tomaste una decisión importante?"],
  h:"Estaba + gerundio cuando + indefinido · Mientras… · De repente…"},
 {t:"Mi gran aventura",k:"tema",g:["Todos los tiempos"],ti:"¡Último día! Cuenta una historia completa.",
  q:["Cuenta una aventura real o inventada: ¿cómo eras y qué hacías antes de que empezara?","¿Qué pasó? Usa al menos tres verbos en indefinido.","¿Qué estaba pasando alrededor mientras tanto?","¿Cómo habrá cambiado tu vida para dentro de un año?","¡Felicidades! ¿Qué fue lo mejor de este calendario?"],
  h:"Antes… (imperfecto) · De repente… (indefinido) · Mientras… (estaba + gerundio) · Dentro de un año habré… (futuro perfecto)"}
];

/* ============ Lógica ============ */
const KEY = "adviento-hablar-v1";
const $ = s => document.querySelector(s);
const profe = /[?&]profe\b/.test(location.search);
const startDate = new Date(START.y, START.m - 1, START.d);
const todayNum = () => {
  const now = new Date(), t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((t0 - startDate) / 864e5) + 1;
};
let done = new Set();
try { done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...done])); } catch(e) {} };
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const unlocked = n => profe || n <= todayNum();
const dateOf = n => { const d = new Date(startDate); d.setDate(d.getDate() + n - 1); return d; };
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast.id); toast.id=setTimeout(()=>t.classList.remove("show"),2600); }

function render(){
  const cur = todayNum();
  $("#grid").innerHTML = TASKS.map((task,i)=>{
    const n=i+1, open=unlocked(n), d=dateOf(n);
    const cls=["door","c"+(i%6), done.has(n)?"done":"", !open?"locked":"", n===cur?"today":""].join(" ");
    return `<button class="${cls}" data-n="${n}" aria-label="Ventana ${n}${open?"":", bloqueada hasta el "+d.getDate()+" de "+MESES[d.getMonth()]}">
      <div class="inside">${done.has(n)?"🌟":"🎁"}</div>
      <div class="leaf"><span class="n">${n}</span><span class="tag">${open?"":d.getDate()+" "+MESES[d.getMonth()].slice(0,3)}</span></div></button>`;
  }).join("");
  $("#count").textContent = done.size + " / " + TASKS.length;
  $("#fill").style.width = (done.size / TASKS.length * 100) + "%";
  let note;
  if (profe) note = "Modo profesora: todas las ventanas están abiertas.";
  else if (cur < 1) note = `El calendario empieza el ${START.d} de ${MESES[START.m-1]}. ¡Hasta entonces!`;
  else if (cur >= TASKS.length) note = "¡Todas las ventanas están abiertas! Puedes volver a cualquiera.";
  else note = "Cada día se abre una ventana nueva. Las anteriores siempre se pueden repetir.";
  $("#note").textContent = note;
}

function openCard(n){
  const t = TASKS[n-1];
  const scene = t.s ? `<div class="scene" style="background:${t.s.bg}" role="img" aria-label="Imagen de la tarea">${t.s.e.map(e=>`<span>${e}</span>`).join("")}</div>` : "";
  const list = t.k==="imagen" ? "ol" : "ul";
  $("#card").innerHTML = `
    <div class="card-head">
      <button class="close" aria-label="Cerrar" id="x">×</button>
      <span class="day">Día ${n} · ${dateOf(n).getDate()} de ${MESES[dateOf(n).getMonth()]}</span>
      <h2 id="ctitle">${esc(t.t)}</h2>
      <p class="instr">${esc(t.ti)}</p>
      <div class="chips">${t.g.map(g=>`<span class="chip">${esc(g)}</span>`).join("")}</div>
    </div>
    <div class="card-body">
      ${scene}
      <div class="qbox"><${list}>${t.q.map(q=>`<li>${esc(q)}</li>`).join("")}</${list}></div>
      <details class="help"><summary>Ayuda: palabras y estructuras</summary><div>${t.h.split(" · ").map(w=>`<b>${esc(w)}</b>`).join(" ")}</div></details>
      <div class="actions">
        <button class="btn main ${done.has(n)?"is-done":""}" id="ok">${done.has(n)?"✓ ¡Hecho!":"¡Ya lo he dicho!"}</button>
        ${n<TASKS.length && unlocked(n+1)?`<button class="btn sec" id="next">Siguiente →</button>`:""}
      </div>
    </div>
    <footer class="card-foot">¡A HABLAR!</footer>`;
  $("#overlay").classList.add("open");
  document.body.style.overflow="hidden";
  $("#overlay").scrollTop=0;
  $("#x").onclick=closeCard;
  $("#ok").onclick=()=>{
    if(done.has(n)){done.delete(n);} else {done.add(n); toast("¡Muy bien! 🎉 ¡Hasta mañana!");}
    save(); render(); openCard(n);
  };
  const nx=$("#next"); if(nx) nx.onclick=()=>openCard(n+1);
}
function closeCard(){ $("#overlay").classList.remove("open"); document.body.style.overflow=""; }

$("#grid").addEventListener("click", e=>{
  const b=e.target.closest(".door"); if(!b) return;
  const n=+b.dataset.n;
  if(!unlocked(n)){
    b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
    const d=dateOf(n); toast(`Esta ventana se abre el ${d.getDate()} de ${MESES[d.getMonth()]} 🔒`); return;
  }
  openCard(n);
});
$("#overlay").addEventListener("click", e=>{ if(e.target.id==="overlay") closeCard(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeCard(); });
render();

/* ============ Nieve ============ */
(function(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c=$("#snow"), x=c.getContext("2d"); let W,H,flakes=[];
  const size=()=>{ W=c.width=innerWidth; H=c.height=innerHeight; flakes=Array.from({length:Math.min(70,Math.floor(W/16))},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2.6+.8,v:Math.random()*.8+.3,a:Math.random()*6})); };
  size(); addEventListener("resize",size);
  (function tick(){ x.clearRect(0,0,W,H); x.fillStyle="rgba(255,255,255,.7)";
    for(const f of flakes){ f.y+=f.v; f.a+=.01; f.x+=Math.sin(f.a)*.4; if(f.y>H+5){f.y=-5;f.x=Math.random()*W}
      x.beginPath(); x.arc(f.x,f.y,f.r,0,7); x.fill(); }
    requestAnimationFrame(tick); })();
})();
</script>
</body>
